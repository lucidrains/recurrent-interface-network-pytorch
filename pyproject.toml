[project]
name = "RIN-pytorch"
version = "0.8.0"
description = "RIN - Recurrent Interface Network - Pytorch"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.6"
license = { file = "LICENSE" }
keywords = [
    "artificial intelligence",
    "deep learning",
    "attention mechanism",
    "denoising diffusion",
    "image and video generation"
]

classifiers=[
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.6",
]

dependencies = [
    "accelerate",
    "beartype",
    "ema-pytorch",
    "einops>=0.6",
    "pillow",
    "torch>=1.12.0",
    "torchvision",
    "tqdm"
]

[project.urls]
Homepage = "https://pypi.org/project/RIN-pytorch/"
Repository = "https://codeberg.org/lucidrains/RIN-pytorch"

[project.optional-dependencies]
examples = []
test = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "rin_pytorch",
    "pyproject.toml",
    "README.md",
    "LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["rin_pytorch"]
